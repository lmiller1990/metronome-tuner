name: ViolinPractice

packages:
  ViolinPracticeCore:
    path: .

targets:
  ViolinPractice:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/ViolinPracticeApp.swift
      - path: App/Audio
        group: Audio
      - path: App/Views
        group: Views
      - path: App/Assets.xcassets
      - path: App/Info.plist
    dependencies:
      - package: ViolinPracticeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ViolinPractice
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  ViolinPractice:
    build:
      targets:
        ViolinPractice: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
